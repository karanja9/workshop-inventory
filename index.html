<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop IMS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-item:hover { background-color: #4a5568; }
        .low-stock { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div class="w-64 bg-slate-800 text-white flex-shrink-0 hidden md:flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-slate-700">Workshop IMS</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="sidebar-item flex items-center p-3 rounded-lg bg-slate-700">
                    <i class="fas fa-boxes mr-3"></i> Inventory
                </a>
                <a href="#" class="sidebar-item flex items-center p-3 rounded-lg text-gray-400">
                    <i class="fas fa-shopping-cart mr-3"></i> Sales Log
                </a>
                <a href="#" class="sidebar-item flex items-center p-3 rounded-lg text-gray-400">
                    <i class="fas fa-chart-line mr-3"></i> Analytics
                </a>
            </nav>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <input type="text" id="searchInput" placeholder="Search by name or SKU..." 
                       class="w-1/3 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>Add New Item
                </button>
            </header>

            <main class="p-6">
                <!-- Dashboard Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-gray-500 text-sm font-semibold uppercase">Total SKUs</p>
                        <h2 id="totalSkus" class="text-3xl font-bold text-gray-800">0</h2>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                        <p class="text-gray-500 text-sm font-semibold uppercase">Low Stock</p>
                        <h2 id="lowStockCount" class="text-3xl font-bold text-red-600">0</h2>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                        <p class="text-gray-500 text-sm font-semibold uppercase">Stock Value (KSH)</p>
                        <h2 id="totalValue" class="text-3xl font-bold text-gray-800">0</h2>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-4 font-semibold text-gray-600">Product</th>
                                <th class="p-4 font-semibold text-gray-600 text-center">Category</th>
                                <th class="p-4 font-semibold text-gray-600">Price (KSH)</th>
                                <th class="p-4 font-semibold text-gray-600">Stock</th>
                                <th class="p-4 font-semibold text-gray-600">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable" class="divide-y">
                            <!-- Rows will be injected here by JS -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Placeholder for data - will be fetched from inventory_data.json
        let inventory = [];

        async function loadData() {
            // Replace with your real fetch URL
            const response = await fetch('inventory_data.json');
            inventory = await response.json();
            renderTable(inventory);
        }

        function renderTable(data) {
            const table = document.getElementById('inventoryTable');
            table.innerHTML = '';

            data.forEach(item => {
                // Logic for Optional Pictures
                // Show image if category is NOT 'Bolts' AND item has a URL
                const showImage = item.category !== 'Bolts' && item.image_url;
                const imgHtml = showImage ? 
                    `<img src="${item.image_url}" class="w-12 h-12 rounded object-cover mr-3 border">` : '';

                const row = `
                    <tr class="${item.stock < 5 ? 'low-stock' : ''} hover:bg-gray-50">
                        <td class="p-4 flex items-center">
                            ${imgHtml}
                            <div>
                                <div class="font-bold text-gray-800">${item.product}</div>
                                <div class="text-xs text-gray-500">${item.sku}</div>
                            </div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 bg-gray-100 rounded text-xs text-gray-600 uppercase font-bold">
                                ${item.category}
                            </span>
                        </td>
                        <td class="p-4 font-medium text-gray-700">${item.price.toLocaleString()}</td>
                        <td class="p-4">
                            <span class="font-bold">${item.stock}</span>
                        </td>
                        <td class="p-4 space-x-2">
                            <button onclick="recordSale('${item.sku}')" class="text-green-600 hover:text-green-800 font-medium">Sell</button>
                            <button class="text-blue-600 hover:text-blue-800 font-medium">Edit</button>
                        </td>
                    </tr>
                `;
                table.innerHTML += row;
            });
            updateStats(data);
        }

        function updateStats(data) {
            document.getElementById('totalSkus').innerText = data.length;
            document.getElementById('lowStockCount').innerText = data.filter(i => i.stock < 5).length;
            const value = data.reduce((acc, curr) => acc + (curr.price * curr.stock), 0);
            document.getElementById('totalValue').innerText = value.toLocaleString();
        }

        function recordSale(sku) {
            const amount = prompt("How many sold?");
            if (amount && !isNaN(amount)) {
                alert(`Selling ${amount} of SKU: ${sku}. (This will trigger your GitHub Action to update the JSON)`);
                // Here we would call the function to push the update to GitHub
            }
        }

        loadData();
    </script>
</body>
</html>
