<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop IMS | Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3f7',
                            100: '#e9e3ee',
                            200: '#d3c7dd',
                            300: '#b8a3c8',
                            400: '#9c7fb0',
                            500: '#714B67',
                            600: '#5a3c52',
                            700: '#4a3244',
                            800: '#3d2b39',
                            900: '#352530'
                        },
                        accent: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
        }

        .dark .glass {
            background: rgba(30,30,30,0.7);
        }

        .sidebar-link {
            transition: all 0.2s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(113,75,103,0.1);
            color: #714B67;
        }

        .dark .sidebar-link:hover,
        .dark .sidebar-link.active {
            background: rgba(113,75,103,0.2);
            color: #b8a3c8;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow:
                0 20px 25px -5px rgba(0,0,0,0.1),
                0 10px 10px -5px rgba(0,0,0,0.04);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
        }

        .stock-bar {
            transition: width 0.5s ease-out;
        }

        .toast {
            animation: toastSlide 0.3s ease-out;
        }

        @keyframes toastSlide {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #714B67;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #sidebar {
            transition: transform 0.3s ease;
        }

        #sidebar.-translate-x-full {
            transform: translateX(-100%);
        }

        @media (max-width: 1023px) {
            main {
                width: 100% !important;
                margin-left: 0 !important;
            }

            body > div.flex > main {
                width: 100% !important;
            }

            main .flex-1.p-6 {
                padding: 1rem !important;
            }

            header {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }

            .grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .overflow-x-auto {
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 800px;
            }

            #item-modal .max-w-lg {
                max-width: 100%;
                margin: 0.5rem;
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar"
        class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-all duration-300 z-40 fixed lg:relative h-full">

        <div class="p-6 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary-500/30">
                    <i class="fas fa-warehouse text-lg"></i>
                </div>

                <div>
                    <h1 class="font-bold text-lg leading-tight">Workshop IMS</h1>
                    <p class="text-xs text-gray-400">Inventory System</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto custom-scrollbar">

            <button onclick="switchView('dashboard')"
                id="nav-dashboard"
                class="sidebar-link active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300">

                <i class="fas fa-chart-pie w-5"></i>
                Dashboard
            </button>

            <button onclick="switchView('inventory')"
                id="nav-inventory"
                class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300">

                <i class="fas fa-boxes w-5"></i>
                Inventory
            </button>

            <button onclick="switchView('lowstock')"
                id="nav-lowstock"
                class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300">

                <i class="fas fa-exclamation-triangle w-5"></i>
                Low Stock
            </button>

            <button onclick="switchView('settings')"
                id="nav-settings"
                class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300">

                <i class="fas fa-cog w-5"></i>
                Settings
            </button>

        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col overflow-hidden w-full lg:ml-64 transition-all duration-300">

        <!-- Header -->
        <header class="glass border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex items-center justify-between z-20">

            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()"
                    class="lg:hidden p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">
                    <i class="fas fa-bars"></i>
                </button>

                <h2 id="page-title" class="text-xl font-bold">
                    Dashboard
                </h2>
            </div>

            <div class="flex items-center gap-3">

                <button onclick="toggleDarkMode()"
                    class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">

                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>

                <button onclick="openAddModal()"
                    class="flex items-center gap-2 px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl text-sm font-medium shadow-lg shadow-primary-500/25 transition-all">

                    <i class="fas fa-plus"></i>
                    Add Item
                </button>

            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6">

            <!-- Dashboard -->
            <div id="view-dashboard" class="fade-in space-y-6">

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 card-hover border border-gray-100 dark:border-gray-700">
                        <div class="text-3xl font-bold mb-1" id="dash-total-items">0</div>
                        <div class="text-sm text-gray-400">Total SKUs</div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 card-hover border border-gray-100 dark:border-gray-700">
                        <div class="text-3xl font-bold mb-1 text-red-500" id="dash-low-stock">0</div>
                        <div class="text-sm text-gray-400">Low Stock Items</div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 card-hover border border-gray-100 dark:border-gray-700">
                        <div class="text-3xl font-bold mb-1" id="dash-total-value">0</div>
                        <div class="text-sm text-gray-400">Stock Value (KSh)</div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 card-hover border border-gray-100 dark:border-gray-700">
                        <div class="text-3xl font-bold mb-1" id="dash-categories">0</div>
                        <div class="text-sm text-gray-400">Categories</div>
                    </div>

                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold mb-4">Stock by Category</h3>
                        <div class="h-64">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold mb-4">Value Distribution</h3>
                        <div class="h-64">
                            <canvas id="valueChart"></canvas>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script>
    let inventory = [];

    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
    }

    function switchView(view) {
        document.getElementById('page-title').textContent =
            view.charAt(0).toUpperCase() + view.slice(1);
    }

    function toggleSidebar() {
        document.getElementById('sidebar')
            .classList.toggle('-translate-x-full');
    }

    function openAddModal() {
        alert("Add Item Modal");
    }

    function updateDashboard() {
        document.getElementById('dash-total-items').textContent = inventory.length;

        const lowStock = inventory.filter(i => i.stock <= 5);
        document.getElementById('dash-low-stock').textContent = lowStock.length;

        const totalValue = inventory.reduce((sum, i) => {
            return sum + (i.price * i.stock);
        }, 0);

        document.getElementById('dash-total-value').textContent =
            totalValue.toLocaleString();

        const cats = [...new Set(inventory.map(i => i.category))];
        document.getElementById('dash-categories').textContent = cats.length;
    }

    function initCharts() {

        const categoryChart = new Chart(
            document.getElementById('categoryChart'),
            {
                type: 'bar',
                data: {
                    labels: ['Tools', 'Parts', 'Electrical'],
                    datasets: [{
                        label: 'Stock',
                        data: [120, 90, 40]
                    }]
                }
            }
        );

        const valueChart = new Chart(
            document.getElementById('valueChart'),
            {
                type: 'doughnut',
                data: {
                    labels: ['Tools', 'Parts', 'Electrical'],
                    datasets: [{
                        data: [50000, 30000, 10000]
                    }]
                }
            }
        );
    }

    updateDashboard();
    initCharts();
</script>

</body>
</html>
