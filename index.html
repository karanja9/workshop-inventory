    <!-- Header -->

    <div class="container mx-auto p-6">
        <!-- Dashboard Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <div class="text-gray-500 text-sm font-semibold uppercase">Total Products</div>
                <div class="text-3xl font-bold" id="total-items">0</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">

            </div>
        </div>

        <!-- Controls -->

            <div class="w-48">

            </div>
            <button onclick="resetFilters()" class="text-gray-500 hover:text-purple-700 font-medium">Clear Filters</button>
        </div>

        <!-- Table Container -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>

                        <th class="px-5 py-3 border-b">Product Name</th>
                        <th class="px-5 py-3 border-b">Category</th>
                        <th class="px-5 py-3 border-b text-right">Price</th>
                        <th class="px-5 py-3 border-b text-right">Stock</th>
                        <th class="px-5 py-3 border-b">Status</th>

            </table>
            <div id="no-results" class="hidden p-10 text-center text-gray-500">No items found matching your criteria.</div>
        </div>

        let filteredData = [...inventoryData];

        document.getElementById('last-updated').innerText = new Date().toLocaleDateString();

        function init() {
            populateCategories();
            renderSummary();
            renderTable();
            
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('category-filter').addEventListener('change', applyFilters);
        }

        function populateCategories() {
            const categories = [...new Set(inventoryData.map(item => item.category))].sort();
            const select = document.getElementById('category-filter');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function renderSummary() {
            const lowStock = inventoryData.filter(item => item.stock <= item.low_stock_threshold).length;
            const totalVal = inventoryData.reduce((sum, item) => sum + (item.price * item.stock), 0);
            
            document.getElementById('total-items').innerText = inventoryData.length;
            document.getElementById('low-stock-count').innerText = lowStock;
            document.getElementById('total-value').innerText = 'KSh ' + totalVal.toLocaleString();
        }

        function renderTable() {
            const tbody = document.getElementById('inventory-body');
            const noResults = document.getElementById('no-results');
            tbody.innerHTML = '';
            
            if (filteredData.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filteredData.forEach(item => {
                    const isLow = item.stock <= item.low_stock_threshold;
                    const statusClass = isLow ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                    const statusText = isLow ? 'Low Stock' : 'In Stock';

                    const row = `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="px-5 py-4 text-sm font-mono text-gray-500">${item.sku}</td>
                            <td class="px-5 py-4">
                                <div class="font-medium text-gray-900">${item.name}</div>
                                <div class="text-xs text-gray-500">${item.description || ''}</div>
                            </td>
                            <td class="px-5 py-4 text-sm">${item.category}</td>
                            <td class="px-5 py-4 text-sm text-right font-semibold">KSh ${item.price.toLocaleString()}</td>
                            <td class="px-5 py-4 text-sm text-right">${item.stock}</td>
                            <td class="px-5 py-4 text-sm">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                    ${statusText}
                                </span>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;

            filteredData = inventoryData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || 
                                     item.sku.toString().includes(searchTerm);
                const matchesCategory = category === 'all' || item.category === category;
                return matchesSearch && matchesCategory;
            });
            renderTable();
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('category-filter').value = 'all';
            applyFilters();
        }

        init();
    </script>
