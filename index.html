<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Inventory | Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .odoo-purple { background-color: #714B67; }
        .odoo-purple-hover:hover { background-color: #5a3c52; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="odoo-purple text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas fa-tools mr-2"></i>Workshop IMS</h1>
        <div class="text-sm flex items-center gap-4">
            <span id="sync-status" class="hidden"><i class="fas fa-sync fa-spin mr-1"></i> Syncing to GitHub...</span>
            <span id="last-updated"></span>
        </div>
    </header>

    <div class="container mx-auto p-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 text-center">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <div class="text-gray-500 text-xs font-bold uppercase">Total SKUs</div>
                <div class="text-3xl font-bold" id="total-items">0</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">
                <div class="text-gray-500 text-xs font-bold uppercase">Low Stock</div>
                <div class="text-3xl font-bold text-red-600" id="low-stock-count">0</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                <div class="text-gray-500 text-xs font-bold uppercase">Stock Value</div>
                <div class="text-3xl font-bold" id="total-value">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4 items-center">
            <input type="text" id="search-input" placeholder="Search name, SKU, or description..." class="flex-1 border rounded px-4 py-2 outline-none focus:ring-2 focus:ring-purple-400">
            <select id="category-filter" class="border rounded px-4 py-2">
                <option value="all">All Categories</option>
            </select>
        </div>

        <!-- Inventory Table -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-left text-xs font-bold uppercase">
                        <th class="px-5 py-3 border-b">SKU</th>
                        <th class="px-5 py-3 border-b">Product & Details</th>
                        <th class="px-5 py-3 border-b">Category</th>
                        <th class="px-5 py-3 border-b text-right">Price (KSh)</th>
                        <th class="px-5 py-3 border-b text-right">Stock</th>
                        <th class="px-5 py-3 border-b text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="inventory-body" class="text-gray-700 text-sm">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-80">
            <h3 class="font-bold mb-4 border-b pb-2">Update Inventory</h3>
            <input type="hidden" id="edit-sku">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 mb-1">Price</label>
                <input type="number" id="edit-price" class="w-full border rounded p-2">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 mb-1">Stock</label>
                <input type="number" id="edit-stock" class="w-full border rounded p-2">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-3 py-1 bg-gray-200 rounded text-sm">Cancel</button>
                <button id="save-btn" onclick="saveChanges()" class="px-3 py-1 odoo-purple text-white rounded text-sm">Save</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = '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';
        const REPO_PATH = 'hassann6/workshop-inventory';

        let inventoryData = [];

        async function loadData() {
            try {
                const res = await fetch('inventory_data.json');
                inventoryData = await res.json();
                populateCategories();
                renderAll();
            } catch (e) { 
                console.error("Could not load data. Ensure inventory_data.json exists."); 
            }
        }

        function renderAll() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';

            let lowStockCount = 0;
            let totalValueSum = 0;

            const filtered = inventoryData.filter(item => {
                // Ensure fields aren't undefined before calling toLowerCase()
                const name = (item.name || "").toLowerCase();
                const sku = (item.sku || "").toString().toLowerCase();
                const desc = (item.description || "").toLowerCase();
                const itemCat = item.category || "General";

                const matchesSearch = name.includes(searchTerm) || sku.includes(searchTerm) || desc.includes(searchTerm);
                const matchesCategory = (category === 'all' || itemCat === category);
                
                return matchesSearch && matchesCategory;
            });

            filtered.forEach(item => {
                const threshold = item.low_stock_threshold || 5;
                const isLow = item.stock <= threshold;
                
                if (isLow) lowStockCount++;
                totalValueSum += (item.price * item.stock);

                // Build the description display
                const descriptionHtml = item.description 
                    ? `<div class="text-xs text-blue-600 italic mt-0.5">${item.description}</div>` 
                    : '';

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-5 py-3 font-mono text-gray-400">${item.sku || '-'}</td>
                        <td class="px-5 py-3">
                            <div class="font-bold text-gray-800">${item.name || 'Unnamed Product'}</div>
                            ${descriptionHtml}
                        </td>
                        <td class="px-5 py-3">
                            <span class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-500 uppercase font-bold">
                                ${item.category || 'General'}
                            </span>
                        </td>
                        <td class="px-5 py-3 text-right font-bold text-slate-700">${(item.price || 0).toLocaleString()}</td>
                        <td class="px-5 py-3 text-right ${isLow ? 'text-red-600 font-bold' : ''}">${item.stock || 0}</td>
                        <td class="px-5 py-3 text-center">
                            <button onclick="openEditModal(${item.sku}, ${item.price}, ${item.stock})" 
                                    class="text-purple-600 border border-purple-200 px-2 py-1 rounded text-xs hover:bg-purple-50 transition">
                                Edit
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-items').innerText = filtered.length;
            document.getElementById('low-stock-count').innerText = lowStockCount;
            document.getElementById('total-value').innerText = totalValueSum.toLocaleString();
        }

        function populateCategories() {
            const cats = [...new Set(inventoryData.map(i => i.category || "General"))].sort();
            const filter = document.getElementById('category-filter');
            // Reset to keep the "All Categories" option
            filter.innerHTML = '<option value="all">All Categories</option>';
            cats.forEach(c => filter.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function openEditModal(sku, price, stock) {
            document.getElementById('edit-sku').value = sku;
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-stock').value = stock;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() { 
            document.getElementById('editModal').classList.add('hidden'); 
        }

        async function saveChanges() {
            const sku = document.getElementById('edit-sku').value;
            const price = document.getElementById('edit-price').value;
            const stock = document.getElementById('edit-stock').value;
            const btn = document.getElementById('save-btn');

            btn.disabled = true; 
            btn.innerText = "Syncing...";
            document.getElementById('sync-status').classList.remove('hidden');

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_PATH}/dispatches`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `token ${GITHUB_TOKEN}`, 
                        'Accept': 'application/vnd.github.v3+json' 
                    },
                    body: JSON.stringify({ 
                        event_type: 'update_inventory', 
                        client_payload: { sku, price, stock } 
                    })
                });

                if (response.ok) {
                    alert("Update sent to GitHub! Processing takes ~60 seconds. Refresh the page then.");
                    closeModal();
                } else { 
                    alert("Error connecting to GitHub. Check your token or repo path."); 
                }
            } catch (err) {
                alert("Network error occurred.");
            } finally {
                btn.disabled = false; 
                btn.innerText = "Save";
                document.getElementById('sync-status').classList.add('hidden');
            }
        }

        // Event Listeners
        document.getElementById('search-input').addEventListener('input', renderAll);
        document.getElementById('category-filter').addEventListener('change', renderAll);
        window.onload = loadData;
    </script>
</body>
</html>
